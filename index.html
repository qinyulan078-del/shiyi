<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拾忆 · 珍藏回忆，照顾今天</title>
<style>
:root{
  --bg:#FFF9F2; --card:#ffffff; --line:#EADFD1;
  --primary:#476451; --primary-d:#38513F; --ink:#3D342F; --ink2:#5F544C;
  --apricot:#FBEBD7; --pink:#F8E9E6; --green:#EAF2E2; --yellow:#F7E3A1;
  --fs-title:30px; --fs-body:20px; --fs-sub:18px;
}
html.big{ --fs-title:32px; --fs-body:24px; --fs-sub:20px; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:#EAE2D6; color:var(--ink); font-size:var(--fs-body); line-height:1.65;
}
#phone{
  max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);
  position:relative;box-shadow:0 0 34px rgba(61,52,47,.22);display:flex;flex-direction:column;
  transition:background .3s;
}
#phone[data-sec=album]{background:linear-gradient(180deg,#FFF9F2 0%,var(--apricot) 55%,#FFF9F2 100%)}
#phone[data-sec=film]{background:linear-gradient(180deg,#FFF9F2 0%,var(--pink) 55%,#FFF9F2 100%)}
#phone[data-sec=listen]{background:linear-gradient(180deg,#FFF9F2 0%,var(--green) 55%,#FFF9F2 100%)}
#app{flex:1;padding:0 18px 108px}
h1{font-size:var(--fs-title);line-height:1.35;font-weight:700}
h2{font-size:calc(var(--fs-body) + 3px);line-height:1.4}
p.sub{color:var(--ink2);font-size:var(--fs-sub);margin-top:6px}
img{max-width:100%}
button{font-family:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:var(--fs-body);color:var(--ink)}

/* ---------- 通用组件 ---------- */
.hd{display:flex;align-items:center;gap:10px;padding:20px 0 6px;position:relative}
.hd h1{flex:1}
.hd-back{background:#fff;border:2px solid var(--line);border-radius:14px;min-height:56px;min-width:56px;
  padding:0 14px;font-size:var(--fs-sub);display:flex;align-items:center;gap:4px;color:var(--ink)}
.hd-right{display:flex;gap:8px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;
  border-radius:18px;border:none;font-size:calc(var(--fs-body) + 1px);font-weight:600;
  background:var(--primary);color:#fff;padding:12px 18px;text-align:center}
.btn:active{background:var(--primary-d)}
.btn[disabled]{opacity:.45}
.btn-sec{background:#fff;color:var(--primary);border:2.5px solid var(--primary)}
.btn-text{background:none;color:var(--primary);text-decoration:underline;min-height:56px;font-size:var(--fs-sub);font-weight:600}
.btn-danger{background:#fff;color:#A6402D;border:2.5px solid #C05B45}
.btn-row{display:flex;gap:12px;margin-top:14px}
.card{background:var(--card);border-radius:22px;box-shadow:0 4px 16px rgba(61,52,47,.09);padding:22px;margin:14px 0}
.card.clickable{cursor:pointer}
.bigcard{border-radius:24px;padding:24px 22px;margin:16px 0;box-shadow:0 5px 18px rgba(61,52,47,.10);
  display:flex;flex-direction:column;gap:8px;cursor:pointer;background:#fff}
.bigcard .ttl{font-size:calc(var(--fs-body) + 4px);font-weight:700;display:flex;align-items:center;gap:10px}
.bigcard .dsc{font-size:var(--fs-sub);color:var(--ink2)}
.bigcard .go{margin-top:10px;align-self:flex-start;background:var(--primary);color:#fff;border-radius:14px;
  padding:10px 22px;font-size:var(--fs-sub);font-weight:600;min-height:56px;display:inline-flex;align-items:center}
.pill{display:inline-block;background:var(--green);color:var(--primary-d);border-radius:999px;
  padding:4px 14px;font-size:var(--fs-sub);font-weight:600}
.pill.demo{background:#F3E2C7;color:#7A5426}
.pill.ai{background:#F8E9E6;color:#8C4A3C}
.note{background:#fff;border-left:5px solid var(--primary);border-radius:12px;padding:14px 16px;
  font-size:var(--fs-sub);color:var(--ink2);margin:14px 0}
.list-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;
  padding:16px;margin:10px 0;box-shadow:0 3px 10px rgba(61,52,47,.07);min-height:64px;cursor:pointer}
.list-row .grow{flex:1}
.txt-btn{background:none;border:none;color:var(--primary);font-size:var(--fs-sub);font-weight:600;
  min-height:56px;min-width:56px;padding:6px 8px;text-decoration:underline}
.inp,textarea.inp,select.inp{width:100%;border:2px solid var(--line);border-radius:14px;background:#fff;
  padding:14px 16px;min-height:56px;margin-top:6px}
textarea.inp{min-height:110px;resize:vertical}
label.lab{display:block;margin-top:16px;font-weight:600}
.field-note{font-size:var(--fs-sub);color:var(--ink2);margin-top:4px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;
  border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:0 3px 10px rgba(61,52,47,.07);min-height:64px}
.switch{position:relative;width:64px;height:38px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;cursor:pointer;margin:0}
.switch i{position:absolute;inset:0;background:#D8CFC2;border-radius:999px;transition:.2s}
.switch i::after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;background:#fff;top:4px;left:4px;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.switch input:checked + i{background:var(--primary)}
.switch input:checked + i::after{left:30px}
.radio-cards{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.radio-card{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--line);
  border-radius:18px;padding:16px;cursor:pointer;min-height:64px}
.radio-card.on{border-color:var(--primary);background:#F3F7EF}
.radio-card .dot{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);flex:none;position:relative}
.radio-card.on .dot{border-color:var(--primary)}
.radio-card.on .dot::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--primary)}

/* ---------- 底部导航 ---------- */
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);
  background:#fff;border-top:1px solid var(--line);display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
#tabbar button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 0 10px;color:var(--ink2);font-size:var(--fs-sub);min-height:64px;justify-content:center}
#tabbar button.on{color:var(--primary);font-weight:700}

/* ---------- 欢迎页花环 ---------- */
.welcome{min-height:calc(100vh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;text-align:center;padding:40px 10px}
.wreath{position:absolute;pointer-events:none}
.wreath.tl{top:-6px;right:-10px}
.wreath.br{bottom:-4px;left:-8px}
.app-name{font-size:84px;font-weight:800;letter-spacing:10px;color:var(--ink);position:relative;z-index:2;line-height:1.2}
.tagline{font-size:calc(var(--fs-body) + 2px);color:var(--ink2);margin-top:18px;position:relative;z-index:2}
.welcome .btn{max-width:300px;margin-top:64px;position:relative;z-index:2}
.fam-link{margin-top:22px;position:relative;z-index:2;background:none;border:none;color:var(--primary);
  font-size:var(--fs-sub);text-decoration:underline;min-height:56px;font-weight:600}
.corner-flower{position:absolute;top:6px;right:4px;pointer-events:none}

/* ---------- 录音 ---------- */
.mic-big{width:130px;height:130px;border-radius:50%;background:var(--primary);border:none;color:#fff;
  display:flex;align-items:center;justify-content:center;margin:18px auto;box-shadow:0 8px 22px rgba(71,100,81,.35)}
.mic-big.recing{background:#A6402D;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(166,64,45,.35)}50%{box-shadow:0 0 0 16px rgba(166,64,45,0)}}
.wave{display:none;gap:6px;align-items:center;justify-content:center;height:46px;margin:8px 0}
.wave.on{display:flex}
.wave i{width:7px;background:var(--primary);border-radius:4px;animation:wv 1s infinite ease-in-out}
.wave i:nth-child(1){animation-delay:0s}.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}
.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}.wave i:nth-child(6){animation-delay:.6s}.wave i:nth-child(7){animation-delay:.72s}
@keyframes wv{0%,100%{height:10px}50%{height:40px}}
.rec-status{text-align:center;font-size:var(--fs-body);font-weight:600;color:#A6402D;min-height:32px}

/* ---------- 照片网格 ---------- */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.photo-cell{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#EFE7DA;cursor:pointer;border:3px solid transparent}
.photo-cell img{width:100%;height:100%;object-fit:cover;display:block}
.photo-cell.sel{border-color:var(--primary)}
.photo-cell .num{position:absolute;top:6px;left:6px;background:var(--primary);color:#fff;border-radius:50%;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.photo-cell .x{position:absolute;top:4px;right:4px;background:rgba(61,52,47,.75);color:#fff;border:none;border-radius:50%;
  width:36px;height:36px;font-size:18px}
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);
  background:#fff;padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:55}

/* ---------- 相册 ---------- */
.shelf-item{display:flex;gap:16px;background:#fff;border-radius:20px;padding:16px;margin:14px 0;
  box-shadow:0 4px 14px rgba(61,52,47,.09);cursor:pointer;align-items:center}
.shelf-cover{width:96px;height:96px;border-radius:14px;object-fit:cover;flex:none;background:#F3EADB}
.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.tpl{border:3px solid var(--line);border-radius:16px;padding:10px;background:#fff;cursor:pointer;text-align:center;font-size:var(--fs-sub);min-height:56px}
.tpl.on{border-color:var(--primary)}
.tpl .pv{height:86px;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.reader-photo{width:100%;border-radius:20px;background:#EFE7DA;display:block}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pager{display:flex;gap:12px;margin-top:16px}

/* ---------- 影片 ---------- */
.film-stage{position:relative;border-radius:20px;overflow:hidden;background:#111;aspect-ratio:4/3}
.film-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s}
.film-stage img.show{opacity:1}
.film-sub{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;
  padding:12px 16px;font-size:var(--fs-sub);text-align:center}
.ai-mark{position:absolute;top:10px;left:10px;background:rgba(140,74,60,.92);color:#fff;
  border-radius:999px;padding:4px 14px;font-size:16px;z-index:3}
.film-ctrl{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.ctrl-btn{background:#fff;border:2px solid var(--line);border-radius:14px;min-height:56px;min-width:56px;
  padding:8px 14px;font-size:var(--fs-sub);display:flex;align-items:center;gap:6px;font-weight:600}
.progress{height:10px;background:#E4DACB;border-radius:99px;overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;background:var(--primary);width:0}

/* ---------- 心情 ---------- */
.mood-opt{display:flex;align-items:center;gap:16px;background:#fff;border:3px solid var(--line);
  border-radius:20px;padding:16px 18px;margin:12px 0;cursor:pointer;min-height:72px;width:100%;text-align:left;font-size:calc(var(--fs-body) + 1px);font-weight:600}
.mood-opt.on{border-color:var(--primary);background:#F3F7EF}

/* ---------- 消息 ---------- */
.msg{max-width:86%;border-radius:18px;padding:14px 16px;margin:10px 0;box-shadow:0 3px 8px rgba(61,52,47,.08)}
.msg.me{margin-left:auto;background:#E4EEE0;border-bottom-right-radius:6px}
.msg.fam{background:#fff;border-bottom-left-radius:6px}
.msg .who{font-size:16px;color:var(--ink2);margin-bottom:4px}
.msg .st{font-size:16px;color:var(--ink2);margin-top:4px}
.msg img{border-radius:12px;margin-top:6px}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(61,52,47,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:22px}
.modal{background:var(--bg);border-radius:24px;max-width:380px;width:100%;padding:26px 22px;max-height:84vh;overflow:auto}
#toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(61,52,47,.94);color:#fff;
  padding:14px 22px;border-radius:14px;font-size:var(--fs-sub);z-index:200;display:none;max-width:86%;text-align:center}
#offlineBar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:#8C6A2F;
  color:#fff;text-align:center;padding:8px;font-size:16px;z-index:150;display:none}
.qr-box{background:#fff;padding:18px;border-radius:18px;display:flex;justify-content:center}

#printArea{display:none}
@media print{
  body{background:#fff}
  #phone,#tabbar,#toast,#offlineBar{display:none !important}
  #printArea{display:block;font-size:16px;color:#000}
  #printArea .pp{page-break-after:always;padding:20px 0}
  #printArea img{max-width:100%;border-radius:8px}
  #printArea h1{font-size:26px}
}
@media (prefers-reduced-motion:reduce){.wave i,.mic-big.recing{animation:none}}
</style>
</head>
<body>
<div id="offlineBar">当前没有网络，已完成的内容会保存在本机。</div>
<div id="phone" data-sec="">
  <div id="app"></div>
</div>
<nav id="tabbar" style="display:none"></nav>
<div id="printArea"></div>
<div id="toast" role="status"></div>
<div id="modalRoot"></div>

<script>
'use strict';
/* ================= 基础工具 ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const fmtSec=s=>{s=Math.max(0,Math.round(s||0));return pad(Math.floor(s/60))+':'+pad(s%60);};
const fmtDate=ts=>{const d=new Date(ts);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';};
const fmtDT=ts=>fmtDate(ts)+' '+pad(new Date(ts).getHours())+':'+pad(new Date(ts).getMinutes());
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};

const store={
  get(k,d){try{const v=localStorage.getItem('shiyi_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('shiyi_'+k,JSON.stringify(v));return true;}catch(e){toast('本机存储空间不足，请先删除部分内容');return false;}}
};
const DEF_SET={big:false,tts:false,lang:'zh',nick:'',privacy:false,setup:false,
  rMood:false,rMoodTime:'20:00',rMsg:true,rFilm:true,rWeek:false,rMemory:false,cloud:false};
let SET=Object.assign({},DEF_SET,store.get('set',{}));
const saveSet=()=>store.set('set',SET);
function applySet(){document.documentElement.classList.toggle('big',!!SET.big);}

const DB={
  albums:()=>store.get('albums',[]), saveAlbums:v=>store.set('albums',v),
  films:()=>store.get('films',[]), saveFilms:v=>store.set('films',v),
  recs:()=>store.get('recs',[]), saveRecs:v=>store.set('recs',v),
  fams:()=>store.get('fams',[]), saveFams:v=>store.set('fams',v),
  msgs:()=>store.get('msgs',[]), saveMsgs:v=>store.set('msgs',v),
  moods:()=>store.get('moods',[]), saveMoods:v=>store.set('moods',v),
  acts:()=>store.get('acts',[]), saveActs:v=>store.set('acts',v),
  trecs:()=>store.get('trecs',[]), saveTrecs:v=>store.set('trecs',v),
};
let D={album:null,film:null};   // 进行中的草稿
let TIMERS=[];
function later(fn,ms){const t=setTimeout(fn,ms);TIMERS.push(t);return t;}
function clearTimers(){TIMERS.forEach(clearTimeout);TIMERS=[];}

/* ================= 提示与弹层 ================= */
let toastT=null;
function toast(msg,ms=2200){const t=$('#toast');t.textContent=msg;t.style.display='block';
  clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',ms);}
function modal(html){const m=document.createElement('div');m.className='mask';
  m.innerHTML='<div class="modal">'+html+'</div>';$('#modalRoot').appendChild(m);return m;}
function closeModal(el){const m=el.closest('.mask');if(m)m.remove();}
function confirmDlg(msg,okText='确定',cancelText='取消'){return new Promise(res=>{
  const m=modal('<h2>'+esc(msg)+'</h2><div class="btn-row"><button class="btn btn-sec" data-x="0">'+esc(cancelText)+'</button><button class="btn" data-x="1">'+esc(okText)+'</button></div>');
  m.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;const v=b.dataset.x==='1';m.remove();res(v);});
});}
function choiceDlg(title,opts){return new Promise(res=>{
  const m=modal('<h2>'+esc(title)+'</h2>'+opts.map((o,i)=>'<button class="btn '+(o.cls||'')+'" style="margin-top:12px" data-x="'+i+'">'+esc(o.t)+'</button>').join(''));
  m.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;const v=+b.dataset.x;m.remove();res(v);});
});}

/* ================= 语音朗读 ================= */
function speak(text,vol=1){if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
  u.lang={zh:'zh-CN',yue:'zh-HK',en:'en-US'}[SET.lang]||'zh-CN';u.volume=vol;u.rate=0.95;
  speechSynthesis.speak(u);}catch(e){}}
function stopSpeak(){if('speechSynthesis' in window)try{speechSynthesis.cancel();}catch(e){}}
function speakTitle(t){if(SET.tts)speak(t);}

/* ================= 音频播放 ================= */
let curAudio=null,curBtn=null;
function playAudio(url,btn,label='播放'){
  if(curAudio&&curBtn===btn){curAudio.pause();curAudio=null;btn.textContent='▶ '+label;return;}
  if(curAudio){curAudio.pause();if(curBtn)curBtn.textContent='▶ '+curBtn.dataset.lab;}
  curAudio=new Audio(url);curBtn=btn;btn.dataset.lab=label;btn.textContent='⏸ 暂停';
  curAudio.onended=()=>{btn.textContent='▶ '+label;curAudio=null;curBtn=null;};
  curAudio.play().catch(()=>{toast('播放失败，请再试一次');btn.textContent='▶ '+label;});
}

/* ================= 录音 ================= */
const REC={mr:null,chunks:[],t0:0,acc:0,timer:null,stream:null,paused:false,cb:null,interrupted:false};
function recElapsed(){return REC.acc+(REC.mr&&!REC.paused?Date.now()-REC.t0:0);}
function recTick(){const el=$('[data-rectime]');if(el)el.textContent='已录 '+fmtSec(recElapsed()/1000);}
async function recStart(cb){
  if(REC.mr)return true;
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('这台设备不支持录音，可以改用打字');return false;}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    REC.stream=st;
    let opt;try{if(MediaRecorder.isTypeSupported('audio/webm'))opt={mimeType:'audio/webm'};}catch(e){}
    REC.mr=new MediaRecorder(st,opt);
    REC.chunks=[];REC.cb=cb;REC.paused=false;REC.acc=0;REC.t0=Date.now();
    REC.mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data);};
    REC.mr.onstop=()=>{
      const blob=new Blob(REC.chunks,{type:(REC.mr&&REC.mr.mimeType)||'audio/webm'});
      const dur=Math.round(recElapsed()/1000);
      const cb2=REC.cb,inter=REC.interrupted;
      REC.mr=null;REC.chunks=[];REC.cb=null;REC.interrupted=false;REC.paused=false;REC.acc=0;
      clearInterval(REC.timer);
      if(REC.stream){REC.stream.getTracks().forEach(t=>t.stop());REC.stream=null;}
      const rd=new FileReader();rd.onload=()=>cb2&&cb2({audio:rd.result,dur,interrupted:inter});
      rd.readAsDataURL(blob);
    };
    REC.mr.start(500);REC.timer=setInterval(recTick,300);
    return true;
  }catch(e){toast('没有获得麦克风权限，可以改用打字');return false;}
}
function recPauseToggle(){
  if(!REC.mr)return;
  if(REC.paused){REC.mr.resume();REC.t0=Date.now();REC.paused=false;}
  else{REC.mr.pause();REC.acc+=Date.now()-REC.t0;REC.paused=true;}
}

/* ================= 照片读取与压缩 ================= */
function pickFiles({multiple=false,capture=false,cb}){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  if(multiple)inp.multiple=true;if(capture)inp.setAttribute('capture','environment');
  inp.onchange=()=>cb([...inp.files]);inp.click();
}
function fileToPhoto(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const M=1200;const s=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    res(c.toDataURL('image/jpeg',0.8));};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));};
  img.src=url;});
}
async function filesToPhotos(files,max,cb){
  if(!files.length)return;
  if(files.length>max){toast('一次最多选'+max+'张照片');files=files.slice(0,max);}
  toast('正在读取照片……',1200);
  const out=[];for(const f of files){try{out.push(await fileToPhoto(f));}catch(e){}}
  cb(out);
}

function flower(cx,cy,r,petal,center){

       '" fill="'+petal+'" transform="rotate('+(a*180/Math.PI+90).toFixed(1)+' '+px.toFixed(1)+' '+py.toFixed(1)+')"/>';}
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.45).toFixed(1)+'" fill="'+center+'"/>';
  return s;
}

function filmStatusText(f){
  if(f.status==='done')return '已完成';
  if(f.status==='cancel')return '已取消（素材已保留）';
  if(Date.now()>f.doneAt)return '已完成';
  return '制作中';
}
function sweepFilms(){ // 把到期的“制作中”标记为完成
  const fs=DB.films();let ch=false;
  fs.forEach(f=>{if(f.status==='making'&&Date.now()>f.doneAt){f.status='done';ch=true;}});
  if(ch)DB.saveFilms(fs);
}

let PLR=null;
function playerStop(){if(PLR){PLR.playing=false;clearInterval(PLR.iv);if(PLR.audioEl){PLR.audioEl.pause();PLR.audioEl=null;}stopSpeak();}}
function renderFilmPreview(fid){
  const f=DB.films().find(x=>x.id===fid);
  if(!f){go('#/films');return;}
  const st=filmStatusText(f);
  PLR={film:f,i:-1,playing:false,acc:0,t0:0,iv:null,sub:true,vol:1,audioEl:null};
  const lines=f.lines&&f.lines.length?f.lines:f.photos.map(()=>({text:''}));
  page({sec:'film',title:'影片预览',body:hd('影片预览')+
    '<div class="film-stage" id="stage">'+
      f.photos.map((p,i)=>'<img data-ph="'+i+'" src="'+p.src+'">').join('')+
      (f.type==='ai'?'<span class="ai-mark">AI艺术加工</span>':'')+
      '<div class="film-sub" id="subBar">准备好后，点「播放」。</div></div>'+
    '<div class="progress"><i id="progI"></i></div>'+
    '<div class="film-ctrl">'+
      '<button class="ctrl-btn" data-act="plr-toggle" id="plrBtn">'+ic('play',22)+'播放</button>'+
      '<button class="ctrl-btn" data-act="plr-sub">'+ic('sub',22)+'字幕：开</button>'+
      '<button class="ctrl-btn" data-act="plr-fs">'+ic('full',22)+'全屏</button>'+
      '<span style="display:flex;align-items:center;gap:6px">'+ic('vol',22)+'<input type="range" min="0" max="100" value="100" data-plrvol style="width:110px"></span></div>'+
    '<p class="sub" style="margin-top:10px">'+esc(f.title)+' · '+f.dur+'秒 · '+st+(f.voice==='sys'?' · 系统旁白为合成声音':'')+'</p>'+
    '<div class="card"><h2>这段影片符合您的意思吗？</h2>'+
      '<div class="btn-row"><button class="btn" data-act="film-save" data-id="'+f.id+'">'+ic('check',24,'#fff')+'保存影片</button>'+
      '<button class="btn btn-sec" data-act="film-backedit" data-id="'+f.id+'">修改内容</button></div>'+
      '<button class="btn btn-sec" style="margin-top:12px" data-act="film-wrong" data-id="'+f.id+'">人物或画面不对</button>'+
      '<button class="btn-text" style="width:100%" data-act="film-rest">先休息一下</button></div>'+
    '<div style="height:20px"></div>'});
  const total=f.dur*1000,seg=total/f.photos.length;
  const show=i=>{
    if(i===PLR.i)return;PLR.i=i;
    $$('#stage img').forEach((im,j)=>im.classList.toggle('show',j===i));
    if(PLR.sub)$('#subBar').textContent=(lines[i]&&lines[i].text)||'';
    if(f.voice==='sys'&&lines[i]&&lines[i].text)speak(lines[i].text,PLR.vol);
  };
  PLR.tick=()=>{
    const el=PLR.acc+(PLR.playing?Date.now()-PLR.t0:0);
    $('#progI').style.width=Math.min(100,el/total*100)+'%';
    if(el>=total){PLR.acc=total;PLR.playing=false;clearInterval(PLR.iv);
      if(PLR.audioEl){PLR.audioEl.pause();PLR.audioEl=null;}
      $('#plrBtn').innerHTML=ic('play',22)+'重新播放';return;}
    show(Math.min(f.photos.length-1,Math.floor(el/seg)));
  };
  PLR.iv=setInterval(PLR?()=>PLR&&PLR.tick&&PLR.tick():null,150);TIMERS.push(PLR.iv);
}

let REV_DAYS=7;
function renderReview(){
  const moods=DB.moods(),trecs=DB.trecs();
  const rows=[];const now=new Date();
  for(let i=0;i<REV_DAYS;i++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);const key=dayKey(d.getTime());
    const m=moods.find(x=>dayKey(x.ts)===key);
    const ts=trecs.filter(t=>dayKey(t.ts)===key);
    rows.push('<div class="card" style="padding:16px"><b>'+(i===0?'今天':i===1?'昨天':(d.getMonth()+1)+'月'+d.getDate()+'日')+'</b>'+
      (m?'<p>心情：'+esc(m.mood)+(m.reason?'（'+esc(m.reason)+'）':'')+'</p>':'<p class="sub">这天没有填写。</p>')+
      ts.map(t=>'<p class="sub">小事：'+esc(t.text||(t.photo?'一张照片':t.audio?'一句语音':'一件小事'))+'</p>').join('')+'</div>');

  const low=moods.filter(m=>Date.now()-m.ts<REV_DAYS*864e5&&(m.k===4||m.k===5)).length;

/* ================= 录音完成统一回调 ================= */
function recDone(ctx,res){
  if(window._recModal){window._recModal.remove();window._recModal=null;}
  if(res.interrupted)toast('录音曾中断，已为您保留片段');
  if(!ctx)return;
  if(ctx.type==='story'&&D.album){const p=D.album.photos[ctx.idx];const t=$('#storyText');if(t)p.story=t.value;
    p.audio=res.audio;p.adur=res.dur;renderStory(ctx.idx);}
  else if(ctx.type==='filmScript'&&D.film){const t=$('#scriptText');if(t)D.film.transcript=t.value;
    D.film.audio=res.audio;D.film.adur=res.dur;renderFilmScript();}
  else if(ctx.type==='private'){PEND_REC={audio:res.audio,dur:res.dur,interrupted:res.interrupted,text:($('#recText')||{}).value||''};go('#/listen/confirm');}
  else if(ctx.type==='trec'){TREC.audio=res.audio;TREC.adur=res.dur;updTrec();}
  else if(ctx.type==='fs'){FS_DRAFT.audio=res.audio;FS_DRAFT.adur=res.dur;updFs();}
  else if(ctx.type==='fmsg'){window.MSG_DRAFT.audio=res.audio;window.MSG_DRAFT.adur=res.dur;renderFMsg(window.MSG_FID);}
}
function updTrec(){const el=$('#trecAttach');if(el)el.innerHTML=(TREC.audio?'<div class="list-row"><span class="grow">已录一句（'+fmtSec(TREC.adur)+'）</span><button class="txt-btn" data-act="trec-play">播放</button></div>':'')+(TREC.photo?'<img src="'+TREC.photo+'" style="width:120px;border-radius:12px">':'');}
function updFs(){const el=$('#fsAttach');if(el)el.innerHTML=(FS_DRAFT.audio?'<div class="list-row"><span class="grow">已录语音（'+fmtSec(FS_DRAFT.adur)+'）</span><button class="txt-btn" data-act="fs-play">播放</button></div>':'')+(FS_DRAFT.photo?'<img src="'+FS_DRAFT.photo+'" style="width:120px;border-radius:12px">':'');}
function recModal(ctx){window._recCtx=ctx;
  const m=modal('<h2>录音</h2><p class="sub">点击开始，再点击结束。</p>'+recorderPanelHTML('点一下开始说')+
    '<button class="btn btn-sec" style="margin-top:12px" data-x="close">先不录了</button>');
  window._recModal=m;
  m.addEventListener('click',e=>{if(e.target.closest('[data-x="close"]')){if(REC.mr){REC.cb=null;recStop();}m.remove();window._recModal=null;}});
}

 'film-new':()=>{D.film={type:null,photos:[],audio:null,adur:0,transcript:'',lines:[],style:'温暖日常',dur:30,voice:'own',music:false};go('#/film/method');},
 'film-method':el=>{D.film.type=el.dataset.v;go('#/film/photos');},
 'film-upload':()=>{const left=8-D.film.photos.length;pickFiles({multiple:true,cb:fs=>filesToPhotos(fs,left,urls=>{D.film.photos.push(...urls.map(src=>({src,label:''})));renderFilmPhotos();})});},
 'film-photo-album':el=>{const albs=DB.albums().filter(a=>a.photos.length);const src=albs[+el.dataset.a].photos[+el.dataset.p].src;
   const i=D.film.photos.findIndex(x=>x.src===src);
   if(i>=0)D.film.photos.splice(i,1);
   else{if(D.film.photos.length>=8){toast('每段影片最多8张照片');return;}D.film.photos.push({src,label:''});}
   renderFilmPhotos();},
 'film-photo-del':el=>{D.film.photos.splice(+el.dataset.i,1);renderFilmPhotos();},
 'film-to-script':()=>{const n=D.film.photos.length;if(n<3){toast('请先选至少3张照片');return;}if(n>8){toast('每段影片最多8张照片');return;}go('#/film/script');},
 'script-gen':()=>{const f=D.film;f.transcript=($('#scriptText')||{}).value||'';
   const parts=f.transcript.split(/[。！？!?\n；;]+/).map(s=>s.trim()).filter(Boolean);
   if(!parts.length&&!f.audio){toast('请先说一说，或写几句');return;}
   const n=f.photos.length,lines=[];
   for(let i=0;i<n;i++){const seg=parts.filter((_,j)=>j%n===i).join('。');lines.push({text:seg?seg+'。':'',editing:false});}
   f.lines=lines;renderFilmScript();toast('已整理成分镜（建议），请您逐段确认');},
 'script-edit':el=>{D.film.lines[+el.dataset.i].editing=true;renderFilmScript();},
 'script-edit-ok':el=>{const i=+el.dataset.i;D.film.lines[i].text=($('#lineEdit'+i)||{}).value||'';D.film.lines[i].editing=false;renderFilmScript();},
 'script-del':el=>{D.film.lines[+el.dataset.i].text='';renderFilmScript();},
 'script-listen':el=>{if(D.film.audio)playAudio(D.film.audio,el,'听一听');},
 'script-redel':()=>{D.film.audio=null;D.film.adur=0;renderFilmScript();},
 'script-ok':()=>{if(!D.film.lines||!D.film.lines.length){toast('请先点「把内容整理成分镜」');return;}go('#/film/style');},
 'fstyle-set':el=>{const k=el.dataset.k;D.film[k]=k==='dur'?+el.dataset.v:el.dataset.v;renderFilmStyle();},
 'film-start':()=>{const f=D.film;
   const title=(f.lines.find(l=>l.text)||{text:''}).text.replace(/[。！？]$/,'').slice(0,12)||'我的回忆影片';
   const rec={id:uid(),title,type:f.type,photos:f.photos,lines:f.lines.map(l=>({text:l.text})),
     audio:f.voice==='own'?f.audio:null,adur:f.adur,dur:f.dur,voice:f.voice,style:f.style,music:false,
     status:'making',doneAt:Date.now()+4500,ts:Date.now()};
   const fs=DB.films();fs.unshift(rec);DB.saveFilms(fs);D.film=null;go('#/film/progress/'+rec.id);},
 'film-cancel':async el=>{if(!await confirmDlg('取消制作？照片和脚本会保留，可以之后重新制作。','取消制作'))return;
   const fs=DB.films();const f=fs.find(x=>x.id===el.dataset.id);if(f){f.status='cancel';DB.saveFilms(fs);}
   toast('已取消，素材和脚本已保留');go('#/films');},
 'plr-toggle':el=>{if(!PLR)return;const f=PLR.film,total=f.dur*1000;
   if(PLR.acc>=total){PLR.acc=0;PLR.i=-1;}
   if(PLR.playing){PLR.acc+=Date.now()-PLR.t0;PLR.playing=false;if(PLR.audioEl)PLR.audioEl.pause();stopSpeak();
     el.innerHTML=ic('play',22)+'播放';}
   else{PLR.playing=true;PLR.t0=Date.now();el.innerHTML=ic('pause',22)+'暂停';
     if(f.voice==='own'&&f.audio&&PLR.acc===0){PLR.audioEl=new Audio(f.audio);PLR.audioEl.volume=PLR.vol;PLR.audioEl.play().catch(()=>{});}}},
 'plr-sub':el=>{PLR.sub=!PLR.sub;$('#subBar').style.display=PLR.sub?'block':'none';el.innerHTML=ic('sub',22)+(PLR.sub?'字幕：开':'字幕：关');},
 'plr-fs':()=>{const s=$('#stage');if(s&&s.requestFullscreen)s.requestFullscreen().catch(()=>{});},
 'film-save':el=>{go('#/film/share/'+el.dataset.id);},
 'film-backedit':el=>{const f=DB.films().find(x=>x.id===el.dataset.id);if(!f)return;
   D.film={type:f.type,photos:f.photos,audio:f.audio,adur:f.adur,transcript:'',lines:f.lines.map(l=>({text:l.text,editing:false})),style:f.style,dur:f.dur,voice:f.voice,music:false};
   go('#/film/script');},
 'film-wrong':async el=>{const c=await choiceDlg('哪部分需要调整？',[{t:'删除这一段字幕'},{t:'改回原照片'},{t:'重新制作'},{t:'先这样，返回',cls:'btn-sec'}]);
   const fs=DB.films();const f=fs.find(x=>x.id===el.dataset.id);if(!f)return;
   if(c===0){if(PLR&&PLR.i>=0&&f.lines[PLR.i]){f.lines[PLR.i].text='';DB.saveFilms(fs);toast('已删除这一段字幕');}else toast('请先播放到那一段');}
   else if(c===1){toast('已改回原照片（原始照片始终保留，不会替代）');}
   else if(c===2){f.status='making';f.doneAt=Date.now()+4500;DB.saveFilms(fs);go('#/film/progress/'+f.id);}},

 'film-export':()=>toast('原型暂未生成真实视频文件，正式版将在这里导出。'),
 'film-send':async el=>{const fam=DB.fams()[0];if(!fam){toast('请先连接家人');go('#/family/connect');return;}
   const fs=DB.films();const f=fs.find(x=>x.id===el.dataset.id);
   if(await confirmDlg('把《'+f.title+'》发给：'+fam.relation+' '+fam.name+'？'+(f.type==='ai'?'（含AI艺术加工标识）':''),'发送')){
     f.shared=true;DB.saveFilms(fs);pushMsg({from:'me',type:'film',content:f.title,ref:f.id,status:'发送中'});toast('已发送给 '+fam.name);}},

/* ================= 全局事件委托 ================= */
document.addEventListener('click',e=>{
  const nv=e.target.closest('[data-nav]');if(nv){go(nv.dataset.nav);return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=Acts[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.set!==undefined){SET[t.dataset.set]=t.type==='checkbox'?t.checked:t.value;saveSet();applySet();if(t.dataset.set==='rMood')renderNotify();}
  if(t.dataset.fset&&D.film){D.film[t.dataset.fset]=t.type==='checkbox'?t.checked:t.value;}
  if(t.dataset.perm&&window.PERM_FID){const fs=DB.fams();const f=fs.find(x=>x.id===window.PERM_FID);if(f){f.perm[t.dataset.perm]=t.checked;DB.saveFams(fs);}}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.live&&D.album){D.album[t.dataset.live.split('.')[1]]=t.value;}
  if(t.dataset.fname!==undefined&&D.film&&D.film.photos[+t.dataset.fname]){D.film.photos[+t.dataset.fname].label=t.value;}
  if(t.hasAttribute&&t.hasAttribute('data-plrvol')&&PLR){PLR.vol=t.value/100;if(PLR.audioEl)PLR.audioEl.volume=PLR.vol;}
  if(t.id==='fmsgText'&&window.MSG_DRAFT){window.MSG_DRAFT.text=t.value;const pv=$('#fmsgPrev');if(pv)pv.textContent=t.value||'（写好后会显示在这里）';}
});

/* ================= 路由 ================= */
const R={
 'welcome':()=>renderWelcome(),'home':()=>renderHome(),'setup':()=>renderSetup(),'today':()=>renderToday(),
 'albums':()=>renderAlbums(),'films':()=>renderFilms(),'mine':()=>renderMine(),'inbox':()=>renderInbox(),
 'trecord':()=>renderTRecord(),'review':()=>renderReview(),'help':()=>renderHelp(),
 'mood':p=>p[1]==='support'?renderMoodSupport(p[2]):renderMood(),
 'activity':p=>p[1]==='doing'?renderActivityDoing():renderActivity(),
 'listen':p=>p[1]==='record'?renderRecord():p[1]==='confirm'?renderRecordConfirm():renderListen(),
 'famside':p=>p[1]==='msg'?renderFamsideMsg():renderFamside(),
 'album':p=>{if(p[1]==='pick')renderPick();else if(p[1]==='arrange')renderArrange();else if(p[1]==='story')renderStory(p[2]);
   else if(p[1]==='cover')renderCover();else if(p[1]==='read')renderRead(p[2],p[3]);else if(p[1]==='export')renderExport(p[2]);else renderAlbums();},
 'film':p=>{if(p[1]==='method')renderFilmMethod();else if(p[1]==='photos')renderFilmPhotos();else if(p[1]==='script')renderFilmScript();
   else if(p[1]==='style')renderFilmStyle();else if(p[1]==='progress')renderFilmProgress(p[2]);else if(p[1]==='preview')renderFilmPreview(p[2]);
   else if(p[1]==='share')renderFilmShare(p[2]);else renderFilms();},
 'family':p=>{if(p[1]==='share')renderPerm(p[2]);else if(p[1]==='msg')renderFMsg(p[2]);else renderConnect();},
 'me':p=>{if(p[1]==='shared')renderShared();else if(p[1]==='storage')renderStorage();else if(p[1]==='account')renderAccount();
   else if(p[1]==='notify')renderNotify();else renderMe();},
};
function route(){
  playerStop();clearTimers();stopSpeak();
  if(curAudio){curAudio.pause();curAudio=null;curBtn=null;}
  if(REC.mr){REC.cb=null;recStop();}
  phone.querySelectorAll('.bottom-bar').forEach(b=>b.remove());
  $('#modalRoot').innerHTML='';
  const h=(location.hash||'#/home').replace(/^#\/?/,'');
  const p=h.split('/');const cur='#/'+h;
  if(navStack[navStack.length-1]!==cur)navStack.push(cur);
  (R[p[0]]||renderHome)(p);
}

window.addEventListener('hashchange',route);
window.addEventListener('offline',()=>$('#offlineBar').style.display='block');
window.addEventListener('online',()=>$('#offlineBar').style.display='none');
if(!navigator.onLine)$('#offlineBar').style.display='block';
applySet();seed();
if(!location.hash)location.hash=SET.privacy?'#/home':'#/welcome';else route();
